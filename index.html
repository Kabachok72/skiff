<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skiff · тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#E7EBEF; --surface:#F7F9FB; --ink:#15202B; --muted:#55626F; --rule:#C6CED6;
  --p1:#2459C8; --p2:#0B7F6F; --p3:#6E45CC; --p4:#A8306B; --p5:#8A5B00;
  --good:#0B7F6F; --warn:#B45309; --onp:#FFFFFF;
  --key:#FFFFFF; --keyink:#15202B; --keyedge:#97A3AF; --bkey:#1B2229; --bkeyink:#F1F4F7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F151B; --surface:#17202A; --ink:#E3E8ED; --muted:#9AA7B3; --rule:#2A3642;
    --p1:#7EA6FF; --p2:#45C9B3; --p3:#B096FF; --p4:#F08BC0; --p5:#E9B651;
    --good:#45C9B3; --warn:#F2A65A; --onp:#0F151B;
    --key:#E8EDF1; --keyink:#15202B; --keyedge:#5D6A77; --bkey:#05080B; --bkeyink:#EEF2F5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F151B; --surface:#17202A; --ink:#E3E8ED; --muted:#9AA7B3; --rule:#2A3642;
  --p1:#7EA6FF; --p2:#45C9B3; --p3:#B096FF; --p4:#F08BC0; --p5:#E9B651;
  --good:#45C9B3; --warn:#F2A65A; --onp:#0F151B;
  --key:#E8EDF1; --keyink:#15202B; --keyedge:#5D6A77; --bkey:#05080B; --bkeyink:#EEF2F5;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:230px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--p1)}
button{font:inherit;color:inherit}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.1rem}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:.7rem;min-height:56px}
.logo{font:700 15px/1 "Unbounded",system-ui,sans-serif;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.stats{margin-left:auto;display:flex;gap:.5rem;font-size:14px;font-weight:600}
.pill{padding:.3rem .6rem;border-radius:999px;border:1px solid var(--rule);background:var(--bg);white-space:nowrap}
.tabs{display:flex;gap:3px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:3px}
.tab{border:0;background:transparent;padding:.45rem .75rem;border-radius:8px;font:600 14px/1 "Golos Text",system-ui,sans-serif;text-decoration:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.cur{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,30,.18)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:520px){.bar .wrap{flex-wrap:wrap;row-gap:.4rem;padding-top:.45rem;padding-bottom:.45rem}.tabs{flex:1 1 100%}.tab{flex:1;text-align:center;padding:.5rem .2rem;font-size:13px}.stats{margin-left:0}.stats .pill{padding:.25rem .5rem;font-size:13px}}

h1{font:700 clamp(28px,7vw,44px)/1.08 "Unbounded",system-ui,sans-serif;margin:1.8rem 0 .6rem}
h2{font:700 20px/1.25 "Unbounded",system-ui,sans-serif;margin:2rem 0 .6rem}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:1.1rem 1.15rem;margin:1rem 0}

.start .row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0}
.chip{border:1.5px solid var(--rule);background:var(--bg);border-radius:999px;padding:.55rem 1rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--p1);background:var(--p1);color:var(--onp)}
.big{display:inline-flex;align-items:center;gap:.6rem;border:0;border-radius:12px;background:var(--p1);color:var(--onp);font:700 17px/1 "Golos Text",system-ui,sans-serif;padding:.95rem 1.4rem;cursor:pointer}
.ghost{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:.6rem .9rem;font-weight:600;cursor:pointer}
.big:focus-visible,.ghost:focus-visible,.chip:focus-visible,.mpill:focus-visible,.step:focus-visible,.logo:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.plan{margin:.6rem 0 0;padding:0;list-style:none;font-size:15px}
.plan li{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--rule)}
.plan li:last-child{border-bottom:0}

.lvl{margin:1rem 0}
.lvl h3{font:700 16px/1.3 "Golos Text",system-ui,sans-serif;margin:0 0 .5rem;color:var(--c)}
.mlist{display:flex;flex-direction:column;gap:.4rem}
.mpill{display:flex;align-items:center;gap:.7rem;text-align:left;width:100%;border:1px solid var(--rule);border-left:4px solid var(--c);background:var(--surface);border-radius:10px;padding:.6rem .8rem;cursor:pointer}
.mpill .t{flex:1}
.mpill .m{font-size:13px;color:var(--muted);white-space:nowrap}
.mpill .s{width:1.5rem;text-align:center;font-weight:700}
.mpill.done .s{color:var(--good)}
.mpill.done .t{color:var(--muted)}
.mpill.next{box-shadow:0 0 0 2px var(--c) inset}

/* session */
.dots{display:flex;gap:6px;margin:1.2rem 0 .4rem}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.dots i.done{background:var(--good)}
.dots i.now{background:var(--c,var(--p1))}
.kind{font-size:14px;font-weight:600;color:var(--c,var(--p1));margin:.6rem 0 0}
.stitle{font:700 clamp(24px,6vw,34px)/1.12 "Unbounded",system-ui,sans-serif;margin:.2rem 0 .6rem}
.timer{display:flex;align-items:center;gap:1rem;margin:.6rem 0 1rem}
.clock{font:700 40px/1 "Unbounded",system-ui,sans-serif;font-variant-numeric:tabular-nums;min-width:6.5ch}
.tbar{flex:1;height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.tbar b{display:block;height:100%;width:0;background:var(--c,var(--p1));transition:width .25s linear}
.timeup{display:none;margin:.4rem 0 1rem;padding:.8rem 1rem;border-radius:12px;border:2px solid var(--warn);color:var(--ink);background:var(--surface);font-weight:600}
.timeup.show{display:block;animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{border-color:transparent}}
@media (prefers-reduced-motion: reduce){.timeup.show{animation:none}.tbar b{transition:none}}
.goal{font-size:18px;margin:.2rem 0 .8rem}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.step{counter-increment:s;display:flex;gap:.8rem;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:.75rem .2rem;cursor:pointer;line-height:1.5}
.step::before{content:counter(s);flex:none;width:1.8rem;height:1.8rem;border-radius:50%;border:2px solid var(--c,var(--p1));color:var(--c,var(--p1));font:700 13px/1.6rem "Unbounded",system-ui,sans-serif;text-align:center}
.step[aria-pressed="true"]::before{content:"✓";background:var(--c,var(--p1));color:var(--onp)}
.step[aria-pressed="true"] span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.2rem 0}
.recall{border:1px dashed var(--rule);border-radius:12px;padding:.9rem 1rem;margin:1rem 0}
.recall .a{display:none;margin-top:.5rem;font-weight:700;color:var(--good)}
.recall.open .a{display:block}
.quizq{font:700 20px/1.35 "Golos Text",system-ui,sans-serif;margin:.6rem 0}
.qfb{min-height:1.6em;font-weight:600}
.qfb.ok{color:var(--good)} .qfb.no{color:var(--warn)}
.more{font-size:15px}
.summary .num{font:700 34px/1 "Unbounded",system-ui,sans-serif}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1rem 0}
.sgrid div{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:.8rem;text-align:center}
.sgrid small{display:block;color:var(--muted);font-size:13px;margin-top:.3rem}

kbd{font:600 .8em/1 "Golos Text",system-ui,sans-serif;display:inline-block;padding:.3em .5em .26em;margin:0 .06em;border:1px solid var(--keyedge);border-bottom-width:3px;border-radius:5px;background:var(--surface);color:var(--ink);white-space:nowrap;vertical-align:.08em}
kbd.k{border:1.5px solid var(--ink);border-radius:999px;background:transparent;padding-left:1.25em;position:relative}
kbd.k::before{content:"";position:absolute;left:.45em;top:50%;width:.45em;height:.45em;margin-top:-.225em;border-radius:50%;background:var(--ink)}
kbd.w{background:var(--key);color:var(--keyink);border-radius:2px 2px 7px 7px;border-bottom-width:4px}
kbd.x{background:var(--bkey);color:var(--bkeyink);border-color:var(--bkey);border-radius:2px 2px 6px 6px}

/* keyboard dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--rule);padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(10,20,30,.12)}
.dock .wrap{max-width:52rem}
.dock-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:14px;margin-bottom:.35rem}
.dock-top .st{color:var(--muted);flex:1;min-width:10rem}
.dock-btn{border:1.5px solid var(--p1);background:var(--p1);color:var(--onp);border-radius:8px;padding:.45rem .75rem;font-weight:600;cursor:pointer;font-size:14px}
.dock-btn.alt{background:transparent;color:var(--ink);border-color:var(--rule)}
.dock-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dock.min .kbwrap{display:none}
body.gaming .kbwrap{display:none}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.hud{display:flex;gap:1rem;flex-wrap:wrap;font-size:15px;margin:.2rem 0 .6rem}
.hud b{font-variant-numeric:tabular-nums}
.gwrap{border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--surface);touch-action:none}
.gwrap canvas{display:block}
.mpill[disabled]{opacity:.55;cursor:not-allowed}
.kb{display:block;width:100%;height:auto;touch-action:manipulation}
.kb .wk{fill:var(--key);stroke:var(--keyedge);stroke-width:1.2;cursor:pointer}
.kb .bk{fill:var(--bkey);stroke:var(--bkey);cursor:pointer}
.kb .wk.on{fill:#FFD84D}
.kb .bk.on{fill:#E0A100;stroke:#E0A100}
.kb .wk.hint{fill:#BFE8DF}
.kb .bk.hint{fill:#2E8B7A;stroke:#2E8B7A}
.kb text{pointer-events:none}
.kb .wn{fill:#15202B;font:600 12.5px "Golos Text",system-ui,sans-serif;text-anchor:middle}
.kb .wn.c{font-weight:800;text-decoration:underline}
.kb .stn{fill:#2459C8;font:700 11px "Golos Text",system-ui,sans-serif;text-anchor:middle}
.kb .bn{fill:#EEF2F5;font:600 10.5px "Golos Text",system-ui,sans-serif;text-anchor:middle}
.kb .ob{fill:none;stroke-width:2}
.kb .ot{font:600 12px "Golos Text",system-ui,sans-serif;text-anchor:middle}
.kb .o3{stroke:var(--p3);fill:var(--p3)} .kb .o4{stroke:var(--p2);fill:var(--p2)} .kb .o5{stroke:var(--p5);fill:var(--p5)}
.kb path.ob{fill:none}
.kb .ot{stroke:none}
footer{padding:2rem 0 1rem;color:var(--muted);font-size:14px}
.hidden{display:none !important}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <nav class="tabs" aria-label="Разделы"><button class="tab cur" id="goHome" type="button" aria-current="page">Тренажёр</button><button class="tab" id="goSchool" type="button">Мастерская</button><button class="tab" id="goGame" type="button">Игра</button><a class="tab" href="uchebnik.html">Справочник</a></nav>
    <div class="stats"><span class="pill" id="xp">0 XP</span><span class="pill" id="streak">🔥 0</span></div>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<footer class="wrap" id="foot">
  <p>Подробные объяснения — в <a href="uchebnik.html" target="_blank" rel="noopener">учебнике Skiff для чайников</a>. Прогресс хранится только в этом браузере.</p>
  <button class="ghost" type="button" id="reset">Сбросить прогресс</button>
</footer>

<section class="dock" id="dock" aria-label="Клавиатура FM-1">
  <div class="wrap">
    <div class="dock-top">
      <button class="dock-btn" type="button" id="connect">Подключить FM-1</button>
      <span class="st" id="mstatus">Не подключено. Клавиши можно нажимать и мышкой.</span>
      <button class="dock-btn alt" type="button" id="dockToggle" aria-expanded="true">Скрыть клавиатуру</button>
    </div>
    <div class="kbwrap" id="kbwrap"></div>
  </div>
</section>
<script>
(function(){
'use strict';
var BOOK = 'uchebnik.html';
var LEVELS = [
  {n:1, title:'Уровень 1 · Ориентир', c:'var(--p1)'},
  {n:2, title:'Уровень 2 · Первый бит', c:'var(--p2)'},
  {n:3, title:'Уровень 3 · Живой грув', c:'var(--p3)'},
  {n:4, title:'Уровень 4 · Звук', c:'var(--p4)'},
  {n:5, title:'Уровень 5 · Трек', c:'var(--p5)'},
  {n:6, title:'Уровень 6 · Продвинутое (по желанию)', c:'var(--p1)'}
];
/* [b:..] кнопка, [k:..] крутилка, [w:..] нижний ряд, [x:..] верхний ряд */
var M = [
 {id:'m1',lvl:1,min:4,ch:2,title:'Карта устройства',goal:'Освоиться: дорожки, звуки, подсказка, меню.',
  steps:['[k:ALGORITHM] — выберите дорожку с басом, потом с барабанами. Понажимайте клавиши.','[k:PRESETS] щелчок вперёд — новый звук, щелчок назад — прежний.','Зажмите [b:HOME] и прочитайте подсказку на экране.','Отпустите [b:HOME] — откроется меню. Закройте его тапом [b:HOME].'],
  recall:['Что будет, если зажать и отпустить HOME?','Откроется меню настроек']},
 {id:'m2',lvl:1,min:3,ch:0,title:'Клавиатура наизусть',quiz:6,goal:'Находить клавиши по названию и номеру шага, не глядя в схему.',
  steps:['Поставьте октаву в 0: [b:OCT−] и [b:OCT+] вместе.','Откройте [b:HOME] — клавиши играют ноты.','Отвечайте на вопросы ниже нажатием клавиши на FM-1 (или мышкой по схеме).'],
  recall:['Какая клавиша — шаг 9?','9-я нижнего ряда, G4']},
 {id:'m3',lvl:1,min:4,ch:2,title:'Соло и мьют: слой GLO',goal:'Глушить и выделять дорожки вживую.',
  steps:['Запустите [b:PLAY].','Держите [b:GLO] и держите N-ю клавишу нижнего ряда — играет только дорожка N.','Держа [b:GLO], тапните N-ю клавишу верхнего ряда — дорожка замолчала. Ещё тап — вернулась.','Закрепите слой: [b:HOME] + [b:GLO]. Закройте тапом [b:GLO].'],
  recall:['Как заглушить дорожку 6?','Держать GLO, тапнуть 6-ю клавишу верхнего ряда']},
 {id:'m1b',lvl:1,min:4,ch:18,title:'Настройки под себя',goal:'Удобный экран и максимум голосов.',
  steps:['Меню: зажмите и отпустите [b:HOME].','[k:ALGORITHM] — вкладка DISPLAY: THEME — тема, LARGE ON — крупный шрифт.','Вкладка CONTROL: STEP PREVIEW ON — шаги звучат под курсором.','Вкладка SYSTEM: CPU — должно стоять 2 CORES (с версии 2.5 включается само, до 16 голосов). Если там CORE 2 FAILED — оставьте 1 CORE.'],
  recall:['Где включается второе ядро?','Меню → SYSTEM → CPU → 2 CORES']},
 {id:'m4',lvl:2,min:8,ch:3,title:'Бочка, снейр, хэт',goal:'Собрать базовый бит по шагам.',
  steps:['Дорожка с барабанами, тап [b:SEQ] — сетка шагов.','Верхний ряд выбирает барабан: 1-я — бочка, 2-я — снейр, 4-я — хэт.','Бочка: шаги 1, 5, 9, 13 (нижний ряд).','Снейр: шаги 5 и 13.','Хэт: шаги 3, 7, 11, 15.','[b:PLAY] — слушайте. Повторное нажатие шага убирает удар.'],
  recall:['На каких шагах доли?','1, 5, 9, 13']},
 {id:'m5',lvl:2,min:4,ch:3,title:'Темп и отмена',goal:'Менять темп и не бояться ошибок.',
  steps:['Держите [b:GLO] и крутите [k:SELECT]: поставьте 90, потом 125.','Уберите один удар хэта.','Зажмите [b:SAVE] — удар вернулся (отмена).','В окне отмены [b:OCT−] — ещё шаг назад, [b:OCT+] — вперёд.'],
  recall:['Как отменить последнее действие?','Зажать SAVE']},
 {id:'m6',lvl:2,min:8,ch:3,title:'Бас по шагам',goal:'Записать басовую линию нота за нотой.',
  steps:['Стоп. Дорожка с басом, тап [b:SEQ].','[b:OCT−] один раз, затем [b:REC] — на экране KEYS WRITE STEPS.','Клавиша = нота и шаг вперёд. Щелчок [k:PRESETS] = пауза.','Сыграйте: [w:A3] · [w:A3] · [w:A4] · [w:A3] · [w:G3] · [w:A3] · [w:C4] · [w:E4], с паузой после каждой.','[b:REC] — выйти из записи, [b:PLAY] — слушать.'],
  recall:['Как поставить паузу при записи по шагам?','Один щелчок PRESETS']},
 {id:'m6b',lvl:2,min:6,ch:6,title:'Длина и копирование',goal:'Из одного такта — два, не записывая заново.',
  steps:['Дорожка с басом, [b:SEQ], [k:SELECT] до PATTERN.','[k:KNOB 1] LENGTH 32 — паттерн стал два такта.','На NOTES: [b:HOME] + поворот [k:PRESETS] — выделите шаги 1–16.','[b:HOME] + [b:OCT−] — копировать. Курсор на шаг 17, [b:HOME] + [b:OCT+] — вставить.','Поменяйте во втором такте одну-две ноты.'],
  recall:['Как скопировать выделенные шаги?','HOME + OCT− (вставить — HOME + OCT+)']},
 {id:'m7',lvl:2,min:5,ch:4,title:'Подбор звука',goal:'Найти свой бас и отметить любимые звуки.',
  steps:['Тап [b:SAVE], [k:SELECT] на PRESETS.','[k:KNOB 4] LIST → BASS: остались только басы.','[k:PRESETS] — послушайте 5–6 басов на своей линии.','[k:KNOB 3] вправо — звёздочка любимому.','На [b:HOME] [k:KNOB 1] — темнее или ярче.'],
  recall:['Как показать только басы?','SAVE → PRESETS, KNOB 4 = BASS']},
 {id:'m8',lvl:3,min:6,ch:6,title:'Дробь и шанс',goal:'Бит перестаёт быть механическим.',
  steps:['Барабаны, [b:SEQ] два раза — страница FEEL.','[k:PRESETS] — курсор на шаг 15, [k:KNOB 2] X3 — дробь.','Шаг 11: [k:KNOB 1] шанс 50 %.','Послушайте 4 круга: каждый раз чуть по-разному.'],

 {id:'m8b',lvl:3,min:6,ch:8,title:'Инструменты SEQ',goal:'Новые идеи из старой партии за секунды.',

 {id:'s4',lvl:1,min:6,title:'Брейкбит',goal:'Ломаный бит вместо ровного.',
  listen:'В брейкбите бочка уходит со счёта, а между основными ударами слышны тихие «призрачные» снейры.',yt:'breakbeat drum programming tutorial',
  steps:['Темп 130–135.','Бочка: шаги 1 и 11. Снейр: 5 и 13.','Призрачные снейры на 10 и 15: на FEEL сила 30–50.','Хэты на нечётных шагах, шанс 80 % на паре из них.'],
  recall:['Что такое «призрачный» удар?','Очень тихий удар между основными']},
 {id:'s5',lvl:1,min:8,title:'Джангл 170',goal:'Нарезанный брейк, дроби и глубокий саб.',
  listen:'Джангл — это быстрые нарезанные живые барабаны поверх медленного, гулкого баса. Слушайте, как куски брейка переставлены и «заикаются».',yt:'jungle break chopping tutorial',
  steps:['Темп 170. Свободная дорожка: держите [b:EDIT], тап [w:C5] — SLICE.','Куски идут по клавишам подряд, чередуя ряды: низ 1, верх 1, низ 2, верх 2… Запишите их по шагам в этом порядке ([b:SEQ], затем [b:REC]), потом переставьте 3–4 куска.','На шагах 15–16: дробь X3–X4.','Бас: SUB BASS, длинные ноты по 1–2 такта.','[b:FX] + [w:G3] в конце фразы — заикание.'],
  recall:['Какой темп типичен для джангла?','Около 170 BPM']},
 {id:'s5b',lvl:1,min:12,title:'Свой брейк: рисунок и грязь',goal:'Собрать ломаный бит в духе классических брейков — из синтезированных барабанов.',
  listen:'«Грязь» и плотность старых брейков дают четыре вещи: ломаный рисунок с тихими ударами, живое отклонение от сетки, перегруз и ощущение старой записи. Всё это есть в Skiff.',yt:'how to program a breakbeat from scratch',
  steps:['Барабанная дорожка, темп 170, на PATTERN длина 32.','Такт 1. Бочка: 1, 3, 11. Снейр громко: 5, 13; тихо (сила 30–50): 8, 10. Хэт: нечётные шаги, на 7 и 15 открытый.','Такт 2. Бочка: 17, 19, 27, 28. Снейр громко: 21, 29; тихо: 24, 26, 31. Шаг 32 — снейр с дробью X3.','Оживить (FEEL): тихим снейрам NUDGE +4…+8, шанс 70–80 % на 2–3 из них.','Грязь: [b:FX] — DIST на CRUSH или FUZZ немного, TONE в плюс, немного REVERB.','Держите [b:FX] + [w:E5] — «старая пластинка». Понравилось — сохраните проект.'],
  recall:['Что даёт брейку «живость»?','Тихие удары, сдвиги NUDGE и шанс']},
 {id:'s5c',lvl:1,min:10,title:'Свой брейк: ресэмплинг',goal:'Превратить свой бит в сэмпл и нарезать его, как настоящий брейк.',
  listen:'Ресэмплинг — записать свой же звук и загрузить обратно как сэмпл. Так брейк становится полностью вашим: можно играть на выступлениях и выпускать без вопросов с правами.',yt:'resampling drums tutorial',
  steps:['Заглушите все дорожки, кроме барабанов (держа [b:GLO], тапайте клавиши верхнего ряда).','Запишите звук FM-1 на компьютер по USB или на телефон — 2 такта (при 170 BPM это около 3 секунд).','Skiff Editor → Samples → USR1 → Choose files. Обрежьте точно по 2 такта, Upload.','Свободная дорожка: держите [b:EDIT] + [w:C5] (SLICE), затем тап [b:EDIT] — SOURCE на USR1.','Режьте и переставляйте куски, как в уроке «Джангл 170».'],
  recall:['Что такое ресэмплинг?','Записать свой звук и загрузить обратно как сэмпл']},
 {id:'s6',lvl:2,min:5,title:'Настроение лада',goal:'Услышать, как лад меняет эмоцию.',
  listen:'Минор звучит задумчиво или мрачно, мажор — светло. Пентатоника — «безопасная»: в ней почти нечему звучать фальшиво.',yt:'major vs minor scale explained',
  steps:['Мелодическая дорожка, [b:SEL], [k:KNOB 3] WHITE.','[k:KNOB 2] MIN — сыграйте простую мелодию по нижнему ряду.','Та же мелодия в MAJ, затем в MPEN.','Выберите лад, который ближе по настроению к вашей музыке.'],
  recall:['Какой лад самый «безопасный»?','Пентатоника']},
 {id:'s7',lvl:2,min:6,title:'Четыре аккорда',goal:'Классическая минорная последовательность.',
  listen:'Огромная часть поп- и электронной музыки держится на 3–4 аккордах по кругу. Попробуйте на слух уловить, когда в любимом треке меняется аккорд.',yt:'minor chord progression beginner',
  steps:['[b:SEL]: MIN, тоника A ([b:SEL] + [w:A3]), QUANTIZE WHITE.','[b:SEL] ещё раз: CHORD DIA3.','В режиме WHITE [w:C4] — первая ступень лада. Сыграйте по такту: [w:C4] → [w:A4] → [w:E4] → [w:B4].','Запишите вживую с метрономом или через TAKE.'],
  recall:['Где первая ступень лада в режиме WHITE?','C4 — 5-я клавиша нижнего ряда']},
 {id:'s8',lvl:2,min:5,title:'Тёплые септаккорды',goal:'Мягкая, «джазовая» окраска.',
  listen:'Мягкие аккорды с «лишней» нотой — фирменная краска даунтемпо и нео-соула. Сравните: обычный аккорд звучит прямо, септаккорд — мечтательно.',yt:'minor 7th chords downtempo',
  steps:['Те же аккорды, что в прошлом уроке, но CHORD DIA7.','VOICING OPEN — шире.','Звук PAD или клавишные, ATTACK длиннее.','Сравните DIA3 и DIA7 на слух.'],
  recall:['Как включить септаккорды?','SEL → CHORD, KNOB 1 = DIA7']},
 {id:'s9',lvl:2,min:6,title:'Бас под аккорды',goal:'Бас, который держит гармонию.',
  listen:'Самый простой бас играет основной тон аккорда. Интереснее — когда он иногда прыгает на октаву или на «пятую» ноту.',yt:'how to write a bassline to chords',
  steps:['Бас по шагам: основной тон каждого аккорда, по такту.','Добавьте прыжки на октаву выше на слабых шагах.','Включите FOLLOW ([b:SEL] три раза), MODE SCALE.','Поменяйте аккорды и послушайте, как бас подстраивается.'],
  recall:['Какую ноту бас играет чаще всего?','Основной тон аккорда']},
 {id:'s10',lvl:2,min:6,title:'Мелодия-вопрос и ответ',goal:'Запоминающийся мотив из 3–5 нот.',
  listen:'Хорошие мелодии часто строятся как диалог: короткая фраза-«вопрос» и похожая фраза-«ответ», которая заканчивается на главной ноте.',yt:'call and response melody writing',
  steps:['[b:SEL]: [k:KNOB 3] SOLO — мелодия на верхнем ряду.','Придумайте «вопрос»: 3–5 нот, 2 такта.','«Ответ»: те же ритм и начало, но конец на тонике (4-я клавиша верхнего ряда).','Запишите через TAKE.'],
  recall:['Где тоника в режиме SOLO?','4-я клавиша верхнего ряда']},
 {id:'s11',lvl:3,min:5,title:'Пэд-подушка',goal:'Мягкий фон, который «держит» трек.',
  listen:'Пэд почти не замечаешь, но без него трек звучит пусто. Он медленно появляется и долго тает.',yt:'how to make warm pad synth',
  steps:['Звук из списка PAD.','[b:ENV]: ATTACK длинный, RELEASE длинный.','[b:FX]: посыл в REVERB побольше, немного CHORUS.','Длинные аккорды по 2 такта.'],
  recall:['Какие две ручки делают пэд мягким?','ATTACK и RELEASE']},
 {id:'s12',lvl:3,min:8,title:'Даунтемпо-грув',goal:'Расслабленный тёплый бит в духе Bonobo.',
  listen:'Даунтемпо: спокойный темп, мягкие барабаны с живым свингом, тёплые клавишные, пространство и немного «пыли» старой записи.',yt:'downtempo beat production tutorial',
  steps:['Темп 90–95, свинг 55 %.','Мягкий кит, вместо снейра римшот.','Клавишные (электропиано FM6 или WHEEL), септаккорды.','[b:GLO] → DELAY 1/8D, немного эха на клавишных.','[b:FX] + [w:E5] — пластиночная «пыль».'],
  recall:['Какой темп у даунтемпо?','Примерно 85–100 BPM']},
 {id:'s13',lvl:3,min:6,title:'Reese-бас',goal:'Толстый «живой» бас драм-н-бейса.',
  listen:'Reese — гудящий бас, который будто медленно «плывёт». Его делают двумя слегка расстроенными пилами.',yt:'reese bass tutorial',
  steps:['ANALOG, две пилы, небольшая расстройка.','VOICE: MONO или UNI.','Фильтр приоткрыт, LFO медленно (SYNC 1 BAR) на CUT.','[b:FX] DIST: немного FUZZ или HARD.'],
  recall:['Из чего делают reese-бас?','Две слегка расстроенные пилы']},
 {id:'s13b',lvl:3,min:8,title:'Рецепты звуков',goal:'Из скучного пресета — свой звук по схеме.',
  listen:'Пресет в одиночку и на динамике всегда звучит бедно. Слушайте в наушниках и стройте звук всегда в одном порядке: основа → яркость → форма → движение → толщина → пространство.',yt:'synth sound design basics',
  steps:['Наденьте наушники.','Жирный бас: SUB BASS или SQR BASS. [b:EDIT] до VOICE — MONO. На [b:HOME] [k:KNOB 1] пониже. [b:FX] — немного DIST, реверба нет.','Эмбиент-пэд: SOFT PAD. [b:ENV] — ATTACK и RELEASE длинные. [b:FX] — много REVERB, немного CHORUS.','Движение: [b:LFO] три раза → ROUTE 2, немного AMOUNT; на LFO 2 SYNC 1 BAR — пэд «дышит».','Лучший из звуков сохраните в USER и отметьте звёздочкой.'],
  recall:['В каком порядке строить звук?','Основа → яркость → форма → движение → толщина → пространство']},
 {id:'s13c',lvl:3,min:10,title:'Библиотека DX7',goal:'Тысячи классических FM-звуков вместо заводских пресетов.',
  listen:'Электропиано, басы и колокола DX7 — звук 80-х, который до сих пор звучит в даунтемпо, хаусе и попе. Бесплатные банки ищите по запросу «DX7 sysex banks».',yt:'DX7 electric piano sound',
  steps:['Скачайте на компьютер бесплатный банк DX7 — файл .syx.','FM-1 по USB, Skiff Editor в Chrome или Edge → Connect → вкладка 6-OP FM.','Import SysEx → ваш файл: обычно внутри 32 звука.','Выберите звук и Send to track — он заиграет на выбранной дорожке. Поиграйте на FM-1.','Понравился — на FM-1 сохраните в USER (на все свои звуки 32 слота).','Остальное держите в библиотеке редактора (вкладка Library) на компьютере и меняйте набор под каждый трек.'],
  recall:['Сколько своих звуков хранится на самом FM-1?','32 слота USER, остальное — в библиотеке на компьютере']},
 {id:'s14',lvl:3,min:5,title:'Даб-пространство',goal:'Эхо и пружинный реверб как инструмент.',
  listen:'В дабе эффекты — это часть игры: удар снейра улетает в эхо, звук то пропадает, то возвращается.',yt:'dub delay throws tutorial',
  steps:['[b:GLO] → REVERB SPRING, DELAY 1/4 с заметным FEEDBACK.','Держите [b:FX] + [w:C5] на снейре в конце фразы — эхо тянется.','Глушите и возвращайте бас (слой GLO).'],
  recall:['Где даб-эхо в слое FX?','FX + C5']},
 {id:'s15',lvl:4,min:6,title:'Структура трека',goal:'Вступление, развитие, яма, кульминация, конец.',
  listen:'Отметьте в любимом треке, когда вступает бочка, когда она пропадает и когда всё возвращается. Обычно части кратны 8 тактам.',yt:'electronic music arrangement basics',
  steps:['План: интро 8 тактов, основа 16, яма 8, основа 16, концовка 8.','[b:SEQ] → SONG: интро — без бочки, яма — без барабанов.','SONG ONCE и прослушайте целиком.'],
  recall:['Кратно скольким тактам обычно меняются части?','8']},
 {id:'s16',lvl:4,min:5,title:'Напряжение и сброс',goal:'Чтобы возвращение бита «било».',
  listen:'Перед возвращением бита звук часто становится тоньше или пропадает бочка — и удар после этого ощущается сильнее.',yt:'build up and drop techniques',
  steps:['За такт до смены части: [b:FX] + [w:D4] — убираем низ.','Последние 2 шага — сбивка ([b:GLO] + [w:F4]).','Или глушите бочку на такт и возвращайте точно на счёт «раз».'],
  recall:['Какой эффект «убирает низ»?','FX + D4 (HPF)']},
 {id:'s17',lvl:4,min:5,title:'Вариации без скуки',goal:'Каждые 4 такта что-то новое — без ручной работы.',
  listen:'Слушайте любимый луповый трек: мелкие детали меняются постоянно, хотя основа одна.',yt:'trig conditions elektron tutorial',
  steps:['Перкуссия: условия 1:2 и 3:4.','Хэты: шанс 70–90 %.','Один удар бочки с условием 4:4 — лишний акцент раз в 4 такта.'],
  recall:['Что значит условие 3:4?','Шаг играет только на 3-м круге из каждых 4']},
 {id:'j1',lvl:6,min:10,title:'Брейк на две дорожки',goal:'«Скелет» и «воздух» — две части одного брейка на разных дорожках.',
  listen:'На живых сетах части бита часто вводят по очереди: сначала хэты и тихие удары, потом бочка и снейр. Так слушатель чувствует нарастание. Сэмпл один на обе дорожки — лишней памяти не нужно.',yt:'live jam drum layers breakbeat',
  steps:['Дорожка A: держите [b:EDIT] + [w:C5] (SLICE), тап [b:EDIT] — SOURCE: ваш брейк. Затем [b:SEQ], [b:REC] и все куски по порядку.','Дорожка B: то же самое — тот же брейк целиком.','На A: [k:PRESETS] — курсор на шаг с хэтом или тихим ударом, при включённом [b:REC] тап [b:EDIT] — шаг стёрт. Оставьте бочки и снейры.','На B наоборот: сотрите бочки и снейры, оставьте «воздух».','[b:REC] выключить, [b:PLAY]: вместе — целый брейк. Ошиблись — зажмите [b:SAVE].'],
  recall:['Как стереть шаг под курсором?','Включить REC и тапнуть EDIT']},
 {id:'j2',lvl:6,min:6,title:'Постепенный вход',goal:'Вводить и уводить части ровно в такт.',
  listen:'Посмотрите любой живой сет на грувбоксе: артист наслаивает партии по одной, каждые 4–8 тактов.',yt:'groovebox live performance build up',
  steps:['[b:HOME] + [b:ARP] — слой PERFORM закреплён.','[k:SELECT] — LAUNCH на BAR: всё срабатывает с начала следующего такта.','Заглушите всё, кроме «воздуха»: тапы по клавишам верхнего ряда с номерами дорожек.','Каждые 4–8 тактов возвращайте по одной: «воздух» → «скелет» → бас → пэд.','Затем уводите в обратном порядке.'],
  recall:['Как сделать, чтобы мьют срабатывал ровно в такт?','PERFORM, LAUNCH = BAR']},
 {id:'j3',lvl:6,min:8,title:'Сцены для джема',goal:'Переключать всю аранжировку одним нажатием.',
  listen:'Сцены — это ваш сетлист внутри одного трека: вступление, основа, кульминация.',yt:'performance scenes groovebox',
  steps:['В PERFORM [k:PRESETS] на SCENE.','Настройте мьюты: только «воздух» и пэд. Держите [b:SAVE] + 1-я клавиша нижнего ряда — сцена 1.','Добавьте «скелет» брейка — [b:SAVE] + 2-я клавиша.','Всё плюс бас — [b:SAVE] + 3-я клавиша.','Играйте: тап 1 → 2 → 3 → 2 → 1. Переход случится ровно на такт.'],
  recall:['Как сохранить сцену?','В PERFORM: держать SAVE + клавиша нижнего ряда']},
 {id:'j4',lvl:6,min:8,title:'Тема 1 → тема 2',goal:'Перейти от одной темы к другой, не останавливаясь.',
  listen:'Переход звучит естественно, если перед ним есть короткое напряжение: сбивка, фильтр или пауза (см. урок «Напряжение и сброс»).',yt:'live jam transitions groovebox',
  steps:['Вариант брейка: [b:SEQ], [k:SELECT] до SONG, [k:KNOB 2] COPY+, [b:OCT+] — копия в позицию B. Переставьте в ней куски, добавьте дроби.','То же для баса: вариант B с другой нотой или ритмом.','В PERFORM [k:PRESETS] на TRACK. Дорожку выбирает [k:ALGORITHM], 2-я клавиша нижнего ряда — позиция B.','За такт до смены: [b:FX] + [w:D4] (убрать низ) или сбивка [b:GLO] + [w:F4]. Переключите дорожки на B.','Тема 2 сыграла — вернитесь к теме 1 (1-я клавиша) или уходите в концовку сценой 1.'],
  recall:['Чем подготовить переход?','Сбивкой, фильтром (FX + D4) или паузой']},
 {id:'j0',lvl:6,min:8,title:'FM-1 + PO-33 вместе',goal:'Pocket Operator играет в одном темпе с FM-1 (Skiff 2.7).',
  listen:'С версии 2.7 FM-1 умеет посылать синхроимпульсы для Pocket Operator: по одному каналу выхода идёт синхро, по другому — музыка в моно.',yt:'pocket operator sync tutorial',
  steps:['На FM-1: меню → AUDIO → SYNC OUT — выберите канал для синхро (LEFT). По умолчанию функция выключена.','Стерео-кабель 3,5 мм: выход FM-1 → вход PO-33.','На PO-33 включите режим синхронизации SY4 или SY5 (в инструкции PO: FUNCTION + BPM).','[b:PLAY] на FM-1 — PO-33 стартует вместе с ним. Если не стартует — попробуйте SYNC INVERT или другой SYNC PPQN.','Сыграйте 2 минуты: бит и сэмплы на PO-33, бас и аккорды на FM-1.'],
  recall:['Где включается синхро для Pocket Operator?','Меню → AUDIO → SYNC OUT']},
 {id:'s18',lvl:6,min:8,title:'Живой сет 5 минут',goal:'Сыграть трек вживую от начала до конца.',
  listen:'Посмотрите любое живое выступление на грувбоксе: заметьте, как часто артист переключает части и глушит дорожки.',yt:'groovebox live jam',
  steps:['3 сцены в PERFORM: интро, основа, яма.','Запишите звук FM-1 на телефон.','Сыграйте 5 минут, не останавливаясь, даже если ошиблись.','Переслушайте и отметьте один удачный и один неудачный момент.'],
  recall:['Как сохранить сцену?','В PERFORM: SAVE + клавиша']},
 {id:'s19',lvl:5,min:8,title:'Разбор трека на слух',goal:'Научиться слышать, из чего сделан трек.',
  listen:'Возьмите любой любимый трек. Цель не скопировать его, а понять устройство: что играет и когда.',yt:'how to analyze a song by ear producer',
  steps:['Темп: стучите [w:G4] в слое [b:GLO] под трек (тап-темп).','Выпишите: барабаны, бас, аккорды, мелодия, фон.','Отметьте по времени, где меняются части.','Соберите на FM-1 похожее настроение своими нотами.'],
  recall:['Как быстро узнать темп трека?','Тап-темп: GLO + G4']},

function runRhythm(box,onDone){

      h+='<button type="button" class="mpill'+(b&&st?' done':'')+'" data-g="'+s.id+'"'+(u?'':' disabled aria-disabled="true"')+'><span class="s">'+(u?'':'🔒')+'</span><span class="t">'+esc(s.title)+'</span><span class="m">'+(u?('★'.repeat(st)+'☆'.repeat(3-st)+(b?' · '+Math.round(b.acc*100)+'%':'')):'пройдите прошлую')+'</span></button>'; });
    h+='</div></div>';
  });
  app.innerHTML=h; window.scrollTo(0,0);
  app.querySelectorAll('.gsp').forEach(function(b){ b.addEventListener('click',function(){ S.gset.speed=+b.dataset.v; save(); renderGameHome(); }); });
  app.querySelectorAll('.gtog').forEach(function(b){ b.addEventListener('click',function(){ S.gset[b.dataset.k]=!S.gset[b.dataset.k]; save(); renderGameHome(); }); });
  document.getElementById('calB').addEventListener('click',renderCalib);
  app.querySelectorAll('[data-g]').forEach(function(b){ b.addEventListener('click',function(){ if(b.disabled) return; renderSong(songById[b.dataset.g]); }); });
}

function renderCalib(){
  gameStop();
  app.innerHTML='<h1 class="stitle" style="margin-top:1.6rem">Калибровка задержки</h1><p class="goal">Наушники и бит должны совпадать с вашими нажатиями. Прозвучат 4 щелчка, потом нажимайте любую клавишу на FM-1 точно в щелчок 12 раз.</p><div class="card quiz"><p class="quizq" id="calq">Готовы?</p><p class="qfb" id="calf"></p><div class="actions"><button type="button" class="big" id="calGo">Старт</button><button type="button" class="ghost" id="calBack">Назад</button></div></div>';
  document.getElementById('calBack').addEventListener('click',renderGameHome);
  document.getElementById('calGo').addEventListener('click',function(e){
    var c=ensureCtx(); if(!c) return; e.target.disabled=true; var beat=60/90, t0=c.currentTime+0.4, hits=[];
    for(var i=0;i<16;i++) click(t0+i*beat,i%4===0);
    document.getElementById('calq').textContent='Слушайте 4 щелчка и нажимайте в такт…';
    quizHandler=function(n,ts){ hits.push(inAudio(ts)); };
    setTimeout(function(){ quizHandler=null; e.target.disabled=false; var d=[];
      hits.forEach(function(h){ var k=Math.round((h-t0)/beat); if(k>=4&&k<16){ var x=h-(t0+k*beat); if(Math.abs(x)<beat*0.4) d.push(x); } });
      var f=document.getElementById('calf');
      if(d.length<6){ f.className='qfb no'; f.textContent='Мало попаданий ('+d.length+'). Попробуйте ещё раз.'; return; }
      d.sort(function(a,b){return a-b;}); var med=d[Math.floor(d.length/2)];
      S.gset.lat=Math.max(-0.1,Math.min(0.3,med)); save();
      f.className='qfb ok'; f.textContent='Готово: задержка '+Math.round(S.gset.lat*1000)+' мс. Игра будет её учитывать.';
    }, 400+16*beat*1000+300);
  });
}
function inAudio(ts){ var c=ensureCtx(); var now=performance.now(); var dt=(typeof ts==='number' && ts>0 && ts<=now+5)?(now-ts)/1000:0; return c.currentTime-dt; }

function renderSong(s){
  gameStop(); quizHandler=null; clearHints(); document.getElementById('foot').classList.add('hidden');
  var b=S.best[s.id];
  var h='<div class="gtop"><button type="button" class="ghost" id="gBack">← Песни</button><span class="muted">'+s.bpm+' BPM · скорость '+Math.round(S.gset.speed*100)+' %</span></div>';
  h+='<h1 class="stitle">'+esc(s.title)+'</h1><p class="goal">'+esc(s.tip)+'</p>';
  h+='<div class="hud" aria-live="off"><span>Очки <b id="gScore">0</b></span><span>Серия <b id="gCombo">0</b></span><span>Точность <b id="gAcc">—</b></span>'+(b?'<span>Рекорд <b>'+'★'.repeat(b.stars)+' '+Math.round(b.acc*100)+'%</b></span>':'')+'</div>';
  h+='<div class="gwrap"><canvas id="gc" aria-label="Падающие ноты над клавиатурой FM-1"></canvas></div>';
  h+='<div class="actions"><button type="button" class="big" id="gPlay">Играть</button><button type="button" class="ghost" id="gDemo">Прослушать</button><button type="button" class="ghost" id="gStop" disabled>Стоп</button></div>';
  app.innerHTML=h; window.scrollTo(0,0); document.body.classList.add('gaming');
  document.getElementById('gBack').addEventListener('click',renderGameHome);
  document.getElementById('gPlay').addEventListener('click',function(){ startRun(s,false); });
  document.getElementById('gDemo').addEventListener('click',function(){ startRun(s,true); });
  document.getElementById('gStop').addEventListener('click',function(){ gameStop(); drawIdle(s); });
  setupCanvas(); drawIdle(s);
  var cv=document.getElementById('gc');
  cv.addEventListener('pointerdown',function(e){ var r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top; var n=keyAt(x,y,r.width,r.height); if(n===null) return; e.preventDefault(); noteOn(n,performance.now()); setTimeout(function(){ noteOff(n); },150); });
}

var CV=null;
function setupCanvas(){ var cv=document.getElementById('gc'); if(!cv) return; var w=cv.parentNode.clientWidth, h=Math.max(280,Math.min(window.innerHeight*0.58,560)); var dpr=window.devicePixelRatio||1; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.width=w+'px'; cv.style.height=h+'px'; var cx=cv.getContext('2d'); cx.setTransform(dpr,0,0,dpr,0,0); var cs=getComputedStyle(document.documentElement); CV={cv:cv,cx:cx,w:w,h:h,kh:Math.min(110,h*0.24),col:{bg:cs.getPropertyValue('--surface').trim(),rule:cs.getPropertyValue('--rule').trim(),ink:cs.getPropertyValue('--ink').trim(),muted:cs.getPropertyValue('--muted').trim(),p1:cs.getPropertyValue('--p1').trim(),p4:cs.getPropertyValue('--p4').trim(),good:cs.getPropertyValue('--good').trim(),warn:cs.getPropertyValue('--warn').trim()}}; }
window.addEventListener('resize',function(){ if(document.getElementById('gc')){ setupCanvas(); if(!G&&CV) drawIdle(null); } });
function laneOf(n){ var i=((n-BASE)%12+12)%12, idx=n-BASE; while(idx<0) idx+=12; while(idx>26) idx-=12; var w=whiteIdx.indexOf(idx); if(w>=0) return {black:false,x:w}; for(var k in blackAfter){ if(blackAfter[k]===idx) return {black:true,x:+k+1}; } return {black:false,x:0}; }
function keyAt(x,y,w,h){ var kh=CV.kh, top=h-kh; if(y<top) return null; var ww=w/16; if(y<top+kh*0.6){ for(var k in blackAfter){ var cx=(+k+1)*ww; if(Math.abs(x-cx)<ww*0.33) return BASE+blackAfter[k]; } } var wi=Math.max(0,Math.min(15,Math.floor(x/ww))); return BASE+whiteIdx[wi]; }
function idxIn(n){ var idx=n-BASE; while(idx<0) idx+=12; while(idx>26) idx-=12; return idx; }
function drawKeys(cx,w,h,kh,flash){
  var ww=w/16, top=h-kh, C=CV.col;
  for(var i=0;i<16;i++){ var on=held[whiteIdx[i]]; cx.fillStyle=on?'#FFD84D':'#FFFFFF'; cx.fillRect(i*ww+1,top,ww-2,kh); cx.strokeStyle='#97A3AF'; cx.strokeRect(i*ww+1.5,top+.5,ww-3,kh-1);
    if(ww>26){ cx.fillStyle='#15202B'; cx.font='600 '+(ww>40?12:10)+'px "Golos Text",system-ui,sans-serif'; cx.textAlign='center'; cx.fillText(chrom[whiteIdx[i]],i*ww+ww/2,h-8); cx.fillStyle='#2459C8'; cx.fillText(String(i+1),i*ww+ww/2,h-24); } }
  for(var k in blackAfter){ var ci=blackAfter[k], x=(+k+1)*ww; cx.fillStyle=held[ci]?'#E0A100':'#1B2229'; cx.fillRect(x-ww*0.3,top,ww*0.6,kh*0.6); }
  cx.fillStyle=C.ink; cx.globalAlpha=0.85; cx.fillRect(0,top-2,w,3); cx.globalAlpha=1;
  if(flash){ flash.forEach(function(f){ var a=Math.max(0,1-f.age/0.35); if(a<=0) return; var l=laneOf(f.n), x=(l.black?l.x*ww:l.x*ww+ww/2); cx.globalAlpha=a; cx.fillStyle=f.c; cx.beginPath(); cx.arc(x,top,ww*0.45,0,Math.PI*2); cx.fill(); cx.globalAlpha=1; }); }
}
function drawIdle(s){ if(!CV) return; var cx=CV.cx,w=CV.w,h=CV.h; cx.clearRect(0,0,w,h); cx.fillStyle=CV.col.bg; cx.fillRect(0,0,w,h); var ww=w/16; cx.strokeStyle=CV.col.rule; for(var i=1;i<16;i++){ cx.beginPath(); cx.moveTo(i*ww,0); cx.lineTo(i*ww,h-CV.kh); cx.stroke(); } cx.fillStyle=CV.col.muted; cx.font='600 15px "Golos Text",system-ui,sans-serif'; cx.textAlign='center'; cx.fillText('Нажмите «Играть» или «Прослушать»',w/2,(h-CV.kh)/2); drawKeys(cx,w,h,CV.kh,null); }

var bufNoise=null;
function noiseBuf(c){ if(bufNoise) return bufNoise; var b=c.createBuffer(1,c.sampleRate*0.3,c.sampleRate), d=b.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1; bufNoise=b; return b; }
function dKick(c,out,t){ var o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(42,t+0.18); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.7,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.28); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.3); }
function dNoise(c,out,t,dur,freq,gain,type){ var s=c.createBufferSource(); s.buffer=noiseBuf(c); var f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; var g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.003); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+dur+0.02); }
function dClick(c,out,t,hi){ var o=c.createOscillator(), g=c.createGain(); o.frequency.value=hi?1500:1000; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(hi?0.28:0.16,t+0.003); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.06); }
function dTone(c,out,t,n,dur){ var o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.value=440*Math.pow(2,(n-69)/12); var d=Math.max(0.12,Math.min(dur,1.5)); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.13,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(out); o.start(t); o.stop(t+d+0.02); }
function scheduleBeat(c,out,style,t0,spb,beats){
  var B=Math.ceil(beats/4)*4;
  for(var b=0;b<B;b++){ var t=t0+b*spb;
    if(style==='click'){ dClick(c,out,t,b%4===0); }
    else if(style==='four'){ dKick(c,out,t); dNoise(c,out,t+spb/2,0.05,7000,0.12,'highpass'); if(b%2===1) dNoise(c,out,t,0.14,1800,0.25,'bandpass'); }
    else if(style==='soft'){ if(b%4===0) dKick(c,out,t); if(b%4===2) dKick(c,out,t+spb*0.62); if(b%2===1) dNoise(c,out,t,0.08,3000,0.12,'bandpass'); dNoise(c,out,t,0.04,8000,0.06,'highpass'); dNoise(c,out,t+spb*0.62,0.04,8000,0.05,'highpass'); }
    else if(style==='break'){ var q=b%4; if(q===0) dKick(c,out,t); if(q===1||q===3) dNoise(c,out,t,0.14,1800,0.3,'bandpass'); if(q===2) { dKick(c,out,t+spb*0.5); } if(q===3) dNoise(c,out,t+spb*0.75,0.08,1800,0.12,'bandpass'); dNoise(c,out,t,0.04,7500,0.08,'highpass'); dNoise(c,out,t+spb*0.5,0.04,7500,0.06,'highpass'); }
  }
}

function startRun(s,demo){
  gameStop(); var c=ensureCtx(); if(!c||!CV) return; setupCanvas();
  var bpm=s.bpm*S.gset.speed, spb=60/bpm, lead=1.8, t0=c.currentTime+0.25+4*spb;
  var out=c.createGain(); out.gain.value=1; out.connect(c.destination);
  for(var i=0;i<4;i++) dClick(c,out,t0-(4-i)*spb,i===0);
  if(S.gset.beat) scheduleBeat(c,out,s.style,t0,spb,s.ch.len);
  var notes=[]; s.ch.ev.forEach(function(e){ e.n.forEach(function(n){ notes.push({t:t0+e.b*spb,n:n,d:e.d*spb,j:null}); }); if(S.gset.guide||demo) e.n.forEach(function(n){ dTone(c,out,t0+e.b*spb,n,e.d*spb*0.9); }); });
  var end=t0+s.ch.len*spb+1.0;
  G={s:s,demo:demo,out:out,notes:notes,t0:t0,end:end,spb:spb,pps:(CV.h-CV.kh)/lead*1,score:0,combo:0,maxc:0,per:0,good:0,miss:0,wrong:0,flash:[],msg:null,lat:S.gset.lat,raf:0};
  document.getElementById('gStop').disabled=false; document.getElementById('gPlay').disabled=true; document.getElementById('gDemo').disabled=true;
  quizHandler=demo?null:function(n,ts){ judge(n,inAudio(ts)); };
  G.raf=requestAnimationFrame(frame);
}
function judge(n,ta){ if(!G) return; var c=ensureCtx(), t=ta-G.lat, best=null, bd=1; G.notes.forEach(function(x){ if(x.j) return; if(((n-x.n)%12+12)%12!==0) return; var d=t-x.t; if(Math.abs(d)<0.16 && Math.abs(d)<Math.abs(bd)){ best=x; bd=d; } });
  if(!best){ G.wrong++; G.combo=0; G.flash.push({n:n,c:CV.col.warn,born:c.currentTime}); G.msg={txt:'Мимо',c:CV.col.warn,born:c.currentTime}; return; }
  var ad=Math.abs(bd), ms=Math.round(bd*1000);
  if(ad<=0.055){ best.j='p'; G.per++; G.combo++; G.score+=100*mult(); G.msg={txt:'Идеально',c:CV.col.good,born:c.currentTime}; }
  else { best.j='g'; G.good++; G.combo++; G.score+=50*mult(); G.msg={txt:'Хорошо · '+(ms<0?'рано ':'поздно ')+Math.abs(ms)+' мс',c:CV.col.p1,born:c.currentTime}; }
  G.maxc=Math.max(G.maxc,G.combo); G.flash.push({n:best.n,c:best.j==='p'?CV.col.good:CV.col.p1,born:c.currentTime});
}
function mult(){ return 1+Math.min(3,Math.floor(G.combo/10)); }
function frame(){
  if(!G) return; var c=ensureCtx(), now=c.currentTime, cx=CV.cx, w=CV.w, h=CV.h, kh=CV.kh, top=h-kh, ww=w/16, C=CV.col, pps=G.pps;
  if(G.demo){ G.notes.forEach(function(x){ if(!x.j && now>=x.t){ x.j='p'; held[idxIn(x.n)]=true; x.off=x.t+Math.min(x.d,0.25); G.flash.push({n:x.n,c:C.good,born:now}); } if(x.off && now>=x.off){ delete held[idxIn(x.n)]; x.off=0; } }); }
  else G.notes.forEach(function(x){ if(!x.j && now-G.lat>x.t+0.16){ x.j='m'; G.miss++; G.combo=0; G.msg={txt:'Пропуск',c:C.warn,born:now}; } });
  cx.clearRect(0,0,w,h); cx.fillStyle=C.bg; cx.fillRect(0,0,w,h);
  cx.strokeStyle=C.rule; cx.lineWidth=1; for(var i=1;i<16;i++){ cx.beginPath(); cx.moveTo(i*ww,0); cx.lineTo(i*ww,top); cx.stroke(); }
  for(var bt=Math.floor((now-G.t0)/G.spb);bt<(now-G.t0)/G.spb+12;bt++){ if(bt<0) continue; var by=top-(G.t0+bt*G.spb-now)*pps; if(by<0) break; cx.globalAlpha=bt%4===0?0.35:0.12; cx.fillStyle=C.ink; cx.fillRect(0,by,w,1); cx.globalAlpha=1; }
  G.notes.forEach(function(x){ var y=top-(x.t-now)*pps; var tail=x.d>G.spb*1.4?x.d*pps*0.9:0, len=18; if(y<-tail-20||y-len>top+5) return; if(x.j==='p'||x.j==='g') return; var l=laneOf(x.n), bw=l.black?ww*0.56:ww*0.82, bx=l.black?l.x*ww-bw/2:l.x*ww+(ww-bw)/2; cx.globalAlpha=x.j==='m'?0.3:1; cx.fillStyle=l.black?C.p4:C.p1; var yy=Math.min(y,top); if(tail){ cx.globalAlpha*=0.35; cx.fillRect(bx+bw*0.38,yy-tail,bw*0.24,tail); cx.globalAlpha=x.j==='m'?0.3:1; } var hh=len; cx.beginPath(); if(cx.roundRect) cx.roundRect(bx,yy-hh,bw,hh,5); else cx.rect(bx,yy-hh,bw,hh); cx.fill(); if(ww>28){ cx.fillStyle='#fff'; cx.font='700 11px "Golos Text",system-ui,sans-serif'; cx.textAlign='center'; cx.fillText(chrom[idxIn(x.n)],bx+bw/2,yy-5.5); } cx.globalAlpha=1; });
  G.flash=G.flash.filter(function(f){ f.age=now-f.born; return f.age<0.4; });
  drawKeys(cx,w,h,kh,G.flash);
  if(now<G.t0){ var cnt=Math.ceil((G.t0-now)/G.spb); cx.fillStyle=C.ink; cx.font='700 54px "Unbounded",system-ui,sans-serif'; cx.textAlign='center'; cx.fillText(String(Math.min(4,cnt)),w/2,top/2); }
  if(G.msg && now-G.msg.born<0.6){ cx.globalAlpha=1-(now-G.msg.born)/0.6; cx.fillStyle=G.msg.c; cx.font='700 20px "Golos Text",system-ui,sans-serif'; cx.textAlign='center'; cx.fillText(G.msg.txt,w/2,top-28); cx.globalAlpha=1; }
  if(G.combo>=10){ cx.fillStyle=C.good; cx.font='700 14px "Golos Text",system-ui,sans-serif'; cx.textAlign='right'; cx.fillText('×'+mult(),w-10,22); }
  if(!G.demo){ var tot=G.per+G.good+G.miss; document.getElementById('gScore').textContent=G.score; document.getElementById('gCombo').textContent=G.combo; document.getElementById('gAcc').textContent=tot?Math.round(100*(G.per+0.5*G.good)/tot)+'%':'—'; }
  if(now>G.end){ var g=G; gameStop(); return g.demo?drawIdle(g.s):renderResult(g); }
  G.raf=requestAnimationFrame(frame);
}
function gameStop(){ if(G){ cancelAnimationFrame(G.raf); try{ G.out.disconnect(); }catch(e){} G=null; } quizHandler=null; held={}; ['gPlay','gDemo'].forEach(function(id){ var b=document.getElementById(id); if(b) b.disabled=false; }); var s=document.getElementById('gStop'); if(s) s.disabled=true; }
function renderResult(g){
  var tot=g.notes.length, acc=tot?(g.per+0.5*g.good)/tot:0, st=stars(acc), prev=S.best[g.s.id], rec=!prev||acc>prev.acc;
  var xp=Math.round(acc*tot*2)+st*20; S.xp+=xp; if(rec) S.best[g.s.id]={acc:acc,stars:Math.max(st,prev?prev.stars:0),score:g.score}; else if(st>prev.stars) prev.stars=st; bumpStreak(); save(); paintStats();
  var idx=SONGS.indexOf(g.s), nxt=SONGS[idx+1];
  var h='<div class="summary"><p class="kind">'+esc(g.s.title)+'</p><h1>'+['Ещё попытка','Неплохо!','Хорошо!','Отлично!'][st]+' '+'★'.repeat(st)+'☆'.repeat(3-st)+'</h1>';
  h+='<div class="sgrid"><div><span class="num">'+Math.round(acc*100)+'%</span><small>точность'+(rec&&acc>0?' · рекорд!':'')+'</small></div><div><span class="num">'+g.maxc+'</span><small>лучшая серия</small></div><div><span class="num">+'+xp+'</span><small>XP</small></div></div>';
  h+='<p>Идеально: <b>'+g.per+'</b> · Хорошо: <b>'+g.good+'</b> · Пропущено: <b>'+g.miss+'</b> · Лишние нажатия: <b>'+g.wrong+'</b></p>';
  var tip = st===0 ? 'Включите «Скорость 60 %» и «Подсказку звуком», сначала послушайте песню кнопкой «Прослушать».' : (g.wrong>g.per ? 'Много лишних нажатий: проверьте, что на FM-1 NOTES OUT стоит на KEYS и музыка на нём остановлена.' : (st<3 ? 'Чтобы получить 3 звезды, нужно 95 % точности. Если всё время «рано» или «поздно» — пройдите калибровку.' : 'Попробуйте на скорости 100 % или переходите к следующей песне.'));
  h+='<div class="card"><b>Совет:</b> '+tip+'</div>';
  h+='<div class="actions"><button type="button" class="big" id="rAgain">Ещё раз</button>'+(nxt&&unlocked(idx+1)?'<button type="button" class="ghost" id="rNext">Дальше: '+esc(nxt.title)+'</button>':'')+'<button type="button" class="ghost" id="rList">К песням</button></div></div>';
  app.innerHTML=h; document.body.classList.remove('gaming'); window.scrollTo(0,0);
  document.getElementById('rAgain').addEventListener('click',function(){ renderSong(g.s); });
  document.getElementById('rList').addEventListener('click',renderGameHome);
  var rn=document.getElementById('rNext'); if(rn) rn.addEventListener('click',function(){ renderSong(nxt); });
}

function leaveOk(){ return !(blocks.length && bi<blocks.length) || confirm('Выйти из сессии? Текущий урок не будет отмечен.'); }
document.getElementById('goHome').addEventListener('click',function(){ if(!leaveOk()) return; blocks=[]; mode='tr'; renderHome(); });
document.getElementById('goSchool').addEventListener('click',function(){ if(!leaveOk()) return; blocks=[]; mode='sc'; renderHome(); });
document.getElementById('goGame').addEventListener('click',function(){ if(!leaveOk()) return; blocks=[]; mode='gm'; renderGameHome(); });
document.getElementById('reset').addEventListener('click',function(){ if(!confirm('Сбросить весь прогресс и XP?')) return; S={done:{},xp:0,streak:0,last:'',carry:[],scarry:[],best:{},gset:{speed:1,guide:true,beat:true,lat:0,all:false}}; save(); paintStats(); renderHome(); });
paintStats(); renderHome();
})();
